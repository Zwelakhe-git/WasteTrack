version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wastetrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wastetrack
      POSTGRES_PASSWORD: wastetrack_dev
      POSTGRES_DB: wastetrack
    ports:
      - "5432:5432"
    volumes:
      - wastetrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wastetrack_pgdata: